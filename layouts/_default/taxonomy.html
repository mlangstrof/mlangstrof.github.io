{{ define "main" }}
<section class="py-10 md:py-14">
    <header class="max-w-2xl">
        <p class="text-sm font-semibold uppercase tracking-widest text-primary">{{ i18n "alltags" }}</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight md:text-4xl">{{ .Title }}</h1>
        {{ with .Content }}<div class="prose-basic mt-4">{{ . }}</div>{{ end }}
    </header>

    {{ with .Pages.ByTitle }}
    <div class="mt-10 flex flex-wrap gap-3">
        {{ range . }}
        <a href="{{ .RelPermalink }}" class="group inline-flex items-center gap-2 rounded-full border border-base-300 bg-base-100 px-4 py-2 text-sm font-medium transition-colors hover:border-primary hover:bg-primary hover:text-primary-content">
            <span>#{{ .Title }}</span>
            <span class="rounded-full bg-base-200 px-2 py-0.5 text-xs text-base-content/60 transition-colors group-hover:bg-primary-content/20 group-hover:text-primary-content">{{ len .Pages }}</span>
        </a>
        {{ end }}
    </div>
    {{ else }}
    <p class="mt-10 text-base-content/60">{{ i18n "noposts" }}</p>
    {{ end }}
</section>
{{ end }}
