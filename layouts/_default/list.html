{{ define "main" }}
<section class="py-10 md:py-14">
    <header class="max-w-2xl">
        <h1 class="text-3xl font-bold tracking-tight md:text-4xl">{{ .Title }}</h1>
        {{ with .Content }}<div class="prose-basic mt-4">{{ . }}</div>{{ end }}
        <p class="mt-3 text-sm text-base-content/60">{{ i18n "postcount" (len .Pages) }}</p>
    </header>

    {{ with .Pages }}
    <div class="mt-10 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        {{ range . }}
        {{ partial "card.html" . }}
        {{ end }}
    </div>
    {{ else }}
    <p class="mt-10 text-base-content/60">{{ i18n "noposts" }}</p>
    {{ end }}
</section>
{{ end }}
