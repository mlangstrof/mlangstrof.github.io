{{ define "main" }}
<section class="py-10">
    <h1 class="text-2xl font-semibold tracking-tight">{{ .Title }}</h1>
    {{ with .Content }}
    <div class="prose-basic mt-4">{{ . }}</div>
    {{ end }}
    <ul class="mt-8 divide-y divide-base-300">
        {{ range .Pages }}
        <li class="py-3">
            <a class="font-medium text-primary underline underline-offset-2" href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ if not .Date.IsZero }}
            <span class="ml-2 text-sm text-base-content/50">
                <time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format (site.Params.dateform | default `Jan 2, 2006`) }}</time>
            </span>
            {{ end }}
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}
